name: Android Job Summary
description: Write Android build information to GitHub Job Summary

inputs:
  build_number:
    description: 'Build number'
    required: true
  type:
    description: 'Distribution type: firebase, playstore, or release (both)'
    required: true
    default: 'firebase'
  testing_uri:
    description: 'Install URI (required for firebase)'
    required: false
  app_name:
    description: 'App display name'
    required: false
    default: 'Project Tattoo'
  play_store_uri:
    description: 'Google Play listing URL for updating the app'
    required: false
    default: 'https://play.google.com/store/apps/details?id=club.ntut.tattoo'

runs:
  using: composite
  steps:
    - name: Write Android Job Summary
      shell: bash
      env:
        APP_NAME: ${{ inputs.app_name }}
      run: |
        if [ "${{ inputs.type }}" == "firebase" ] || [ "${{ inputs.type }}" == "release" ]; then
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        ### Android (Firebase App Distribution)
        Build **${{ inputs.build_number }}** successfully uploaded to Firebase App Distribution.
        [Install build ${{ inputs.build_number }}](${{ inputs.testing_uri }})
        > **Note:** It may take a few minutes for the build to appear in the Firebase App after upload.
        EOF
        fi
        if [ "${{ inputs.type }}" == "playstore" ] || [ "${{ inputs.type }}" == "release" ]; then
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        Build **${{ inputs.build_number }}** successfully uploaded to Google Play.
        [Update to the latest build on Google Play](${{ inputs.play_store_uri }})

        1. Open the Google Play Store on your Android device
        2. Select "$APP_NAME"
        3. Install or update to the latest build

        > **Note:** It may take ~30 minutes for the build to appear in the Play Store after upload.
        EOF
        fi
