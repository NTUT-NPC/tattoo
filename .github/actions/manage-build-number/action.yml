name: Manage Build Number
description: Reads, increments, and outputs the build number; callers must serialize allocation

inputs:
  github_token:
    description: GitHub token with permissions to read and write repository variables
    required: true

outputs:
  build_number:
    description: The incremented build number
    value: ${{ steps.increment.outputs.build_number }}

runs:
  using: composite
  steps:
    - name: Increment and update build number
      id: increment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        BUILD_NUMBER=$(gh api \
          "repos/$GITHUB_REPOSITORY/actions/variables/build_number" \
          --jq .value)
        NEW_NUMBER=$((BUILD_NUMBER + 1))

        gh api --method PATCH \
          "repos/$GITHUB_REPOSITORY/actions/variables/build_number" \
          -f name=build_number \
          -f value="$NEW_NUMBER"

        echo "build_number: $BUILD_NUMBER → $NEW_NUMBER"
        echo "build_number=$NEW_NUMBER" >> "$GITHUB_OUTPUT"
