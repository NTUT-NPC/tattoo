name: Build Android

on:
  workflow_call:
    inputs:
      environment:
        description: Build flavor and GitHub environment
        required: true
        type: string
      build_number:
        description: Flutter build number
        required: true
        type: string
      version_suffix:
        description: Version suffix appended by the build
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: >-
        ${{ github.workflow }}-${{
          github.event.pull_request.number || github.ref }}-android-build
      cancel-in-progress: ${{ github.event.action == 'synchronize' }}
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          platform: android

      - name: Prepare build credentials
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: dart run tool/credentials.dart fetch

      - name: Build Android artifact
        run: >-
          flutter build appbundle
          --release
          --flavor "${{ inputs.environment }}"
          --build-number "${{ inputs.build_number }}"
          --no-pub
          --dart-define=USE_FIREBASE=true
          --dart-define=cronetHttpNoPlay=true
          --dart-define="VERSION_SUFFIX=${{ inputs.version_suffix }}"
          --dart-define="STORE_URL=${{ vars.ANDROID_STORE_URL }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ inputs.environment }}-${{ inputs.build_number }}
          path: build/app/outputs/bundle/${{ inputs.environment }}Release/app-${{ inputs.environment }}-release.aab
          if-no-files-found: error
