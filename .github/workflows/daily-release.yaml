name: Daily Release

on:
  schedule:
    - cron: "7 22 * * *" # Daily at 06:07 UTC+8 (22:07 UTC) 🫴
  workflow_dispatch:
    inputs:
      include_public_testers:
        description: Upload to external public testers (TestFlight and Google Play)
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.build-number.outputs.build_number }}
      version_suffix: ${{ steps.version-suffix.outputs.suffix }}
      date: ${{ steps.version-suffix.outputs.date }}
      commit_sha: ${{ steps.check-changes.outputs.commit_sha }}
      commit_message: ${{ steps.check-changes.outputs.commit_message }}
      skip_build: ${{ steps.check-changes.outputs.skip }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      store_changelog: ${{ steps.changelog.outputs.store_changelog }}
      public_testers: ${{ github.event_name == 'schedule' || inputs.include_public_testers == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set Version Suffix
        id: version-suffix
        run: |
          DATE=$(TZ='Asia/Taipei' date +'%Y%m%d')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "suffix=daily.$DATE" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check-changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "commit_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_message=$(git show -s --format=%s)" >> "$GITHUB_OUTPUT"
          if gh release view daily &>/dev/null; then
            LAST_SHA=$(gh release view daily --json targetCommitish -q .targetCommitish)
            CURRENT_SHA=$(git rev-parse HEAD)
            echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
            if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No changes since last daily build ($LAST_SHA). Skipping."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manage Build Number
        if: steps.check-changes.outputs.skip != 'true'
        id: build-number
        uses: ./.github/actions/manage-build-number
        with:
          github_token: ${{ secrets.BUILD_NUMBER_PAT }}
          current_build_number: ${{ vars.build_number }}

      - name: Generate changelog
        if: steps.check-changes.outputs.skip != 'true'
        id: changelog
        uses: ./.github/actions/generate-changelog
        with:
          github_token: ${{ github.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          last_sha: ${{ steps.check-changes.outputs.last_sha }}
          head_ref: ${{ github.sha }}
          fallback_message: ${{ steps.check-changes.outputs.commit_message }}
          model: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}

  build-android:
    if: needs.prepare.outputs.skip_build != 'true'
    needs: [prepare]
    uses: ./.github/workflows/build-android.yaml
    with:
      environment: staging
      build_number: ${{ needs.prepare.outputs.build_number }}
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  build-ios:
    if: needs.prepare.outputs.skip_build != 'true'
    needs: [prepare]
    uses: ./.github/workflows/build-ios.yaml
    with:
      environment: staging
      build_number: ${{ needs.prepare.outputs.build_number }}
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  upload-android-firebase:
    environment:
      name: staging
      deployment: false
    runs-on: ubuntu-latest
    needs: [prepare, build-android]
    outputs:
      testing_uri: ${{ steps.upload.outputs.testing_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: android

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: build/app/outputs/bundle/stagingRelease

      - name: Materialize Android upload credential
        env:
          ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON }}
        id: credential
        run: |
          umask 077
          printf '%s' "$ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/android-upload-service-account.json"
          echo "path=$RUNNER_TEMP/android-upload-service-account.json" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASEAPPDISTRO_APP: ${{ vars.FIREBASEAPPDISTRO_APP }}
          CHANGELOG: |
            Daily Build ${{ needs.prepare.outputs.date }}
            ${{ needs.prepare.outputs.store_changelog }}
          PR_TITLE: Daily Build ${{ needs.prepare.outputs.date }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
        id: upload
        run: >-
          bundle exec fastlane android upload_firebase
          aab:"${{ github.workspace }}/build/app/outputs/bundle/stagingRelease/app-staging-release.aab"
          service_credentials_file:"${{ steps.credential.outputs.path }}"

  upload-android-play:
    if: needs.prepare.outputs.public_testers == 'true'
    environment:
      name: staging
      deployment: false
    runs-on: ubuntu-latest
    needs: [prepare, build-android]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: android

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: build/app/outputs/bundle/stagingRelease

      - name: Materialize Android upload credential
        env:
          ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON }}
        id: credential
        run: |
          umask 077
          printf '%s' "$ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/android-upload-service-account.json"
          echo "path=$RUNNER_TEMP/android-upload-service-account.json" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play beta
        env:
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          CHANGELOG: |
            Daily Build ${{ needs.prepare.outputs.date }}
            ${{ needs.prepare.outputs.store_changelog }}
          PR_TITLE: Daily Build ${{ needs.prepare.outputs.date }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
        run: >-
          bundle exec fastlane android upload_play_store
          aab:"${{ github.workspace }}/build/app/outputs/bundle/stagingRelease/app-staging-release.aab"
          service_credentials_file:"${{ steps.credential.outputs.path }}"
          track:beta
          build_number:${{ needs.prepare.outputs.build_number }}

  upload-ios-testflight:
    environment:
      name: staging
      deployment: false
    runs-on: macos-26
    needs: [prepare, build-ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: ios

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: .

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          CHANGELOG: |
            Daily Build ${{ needs.prepare.outputs.date }}
            ${{ needs.prepare.outputs.store_changelog }}
          PR_TITLE: Daily Build ${{ needs.prepare.outputs.date }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
        id: upload
        run: >-
          bundle exec fastlane ios upload_testflight
          ipa:"${{ github.workspace }}/build/ios/ipa/app-release.ipa"
          include_public_testers:${{ needs.prepare.outputs.public_testers }}

  upload-ios-symbols:
    environment:
      name: staging
      deployment: false
    runs-on: macos-26
    needs: [prepare, build-ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: ios

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: .

      - name: Restore upload-symbols permission
        run: chmod +x build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols

      - name: Upload Crashlytics symbols
        run: >-
          bundle exec fastlane ios upload_symbols
          dsym:"${{ github.workspace }}/build/ios/archive/Runner.xcarchive/dSYMs/Runner.app.dSYM.zip"
          gsp:"${{ github.workspace }}/ios/Runner/GoogleService-Info-staging.plist"
          upload_symbols_binary:"${{ github.workspace }}/build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"

  report:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip_build != 'true'
    environment: staging
    runs-on: ubuntu-latest
    needs:
      - prepare
      - upload-android-firebase
      - upload-android-play
      - upload-ios-testflight
      - upload-ios-symbols
    permissions:
      contents: write
    steps:
      - name: Write deployment report
        id: results
        env:
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: |
          android_success=true
          ios_success=true

          if [ "${{ needs.upload-android-firebase.result }}" != "success" ]; then
            android_success=false
          fi
          if [ "${{ needs.prepare.outputs.public_testers }}" = "true" ]; then
            if [ "${{ needs.upload-android-play.result }}" != "success" ]; then
              android_success=false
            fi
          elif [ "${{ needs.upload-android-play.result }}" != "skipped" ]; then
            android_success=false
          fi

          if [ "${{ needs.upload-ios-testflight.result }}" != "success" ] || \
             [ "${{ needs.upload-ios-symbols.result }}" != "success" ]; then
            ios_success=false
          fi

          {
            echo "**Build Number:** ${{ needs.prepare.outputs.build_number }}"
            echo "**Commit:** [${{ needs.prepare.outputs.commit_sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo
            echo "## What's changed"
            printf '%s\n' "$CHANGELOG"
            echo
            echo "## Deployment"
            echo
            echo "### Android"
            if [ "${{ needs.upload-android-firebase.result }}" = "success" ]; then
              echo "- **Firebase App Distribution:** [Install build ${{ needs.prepare.outputs.build_number }}](${{ needs.upload-android-firebase.outputs.testing_uri }})"
            else
              echo "- **Firebase App Distribution:** ${{ needs.upload-android-firebase.result }}"
            fi
            if [ "${{ needs.upload-android-play.result }}" = "success" ]; then
              echo "- **Google Play beta:** [Join the testing program](${{ vars.ANDROID_STORE_URL }})"
              echo
              echo "> [!NOTE]"
              echo "> Google Play processing may take up to 30 minutes."
            else
              echo "- **Google Play beta:** ${{ needs.upload-android-play.result }}"
            fi
            echo
            echo "### iOS (TestFlight)"
            if [ "${{ needs.upload-ios-testflight.result }}" = "success" ]; then
              echo "- **TestFlight:** [Join TestFlight](${{ vars.IOS_STORE_URL }}) to install build ${{ needs.prepare.outputs.build_number }}."
              echo "- **Tester groups:** ${{ needs.prepare.outputs.public_testers == 'true' && 'Private External Testers and Public External Testers' || 'Private External Testers' }}"
              echo
              echo "> [!TIP]"
              echo "> Install TestFlight from the App Store if needed. TestFlight is unstable on NTUT Wi-Fi; switch networks if installation or updates fail."
            else
              echo "- **TestFlight:** ${{ needs.upload-ios-testflight.result }}"
            fi
            echo "- **Crashlytics symbols:** ${{ needs.upload-ios-symbols.result }}"
          } > "$RUNNER_TEMP/daily-release-notes.md"

          {
            echo "## Daily Release"
            cat "$RUNNER_TEMP/daily-release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "android_success=$android_success" >> "$GITHUB_OUTPUT"
          echo "ios_success=$ios_success" >> "$GITHUB_OUTPUT"
          if [ "$android_success" = "true" ] && [ "$ios_success" = "true" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pre-release
        if: steps.results.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view daily &>/dev/null; then
            gh api \
              --method PATCH \
              "/repos/${{ github.repository }}/git/refs/tags/daily" \
              -f sha="${{ github.sha }}" \
              -F force=true
            gh release edit daily \
              --title "Daily Build $(TZ='Asia/Taipei' date +'%Y-%m-%d')" \
              --notes-file "$RUNNER_TEMP/daily-release-notes.md" \
              --prerelease
          else
            gh release create daily \
              --title "Daily Build $(TZ='Asia/Taipei' date +'%Y-%m-%d')" \
              --notes-file "$RUNNER_TEMP/daily-release-notes.md" \
              --target "${{ github.sha }}" \
              --prerelease
          fi

      - name: Fail incomplete daily release
        if: steps.results.outputs.failed == 'true'
        run: |
          echo "::error::One or more daily release destinations failed or were unexpectedly skipped"
          exit 1
