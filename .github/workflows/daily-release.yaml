name: Daily Release

on:
  schedule:
    - cron: "0 21 * * *" # Daily at 05:00 UTC+8 (21:00 UTC)
  workflow_dispatch:
    inputs:
      include_public_testers:
        description: Upload to external public testers (TestFlight and Google Play)
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.build-number.outputs.build_number }}
      version_suffix: ${{ steps.version-suffix.outputs.suffix }}
      date: ${{ steps.version-suffix.outputs.date }}
      commit_sha: ${{ steps.summary.outputs.sha }}
      commit_message: ${{ steps.summary.outputs.message }}
      skip_build: ${{ steps.check-changes.outputs.skip }}
      store_changelog: ${{ steps.changelog.outputs.store_changelog }}
      public_testers: ${{ github.event_name == 'schedule' || inputs.include_public_testers == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set Version Suffix
        id: version-suffix
        shell: bash
        run: |
          DATE=$(TZ='Asia/Taipei' date +'%Y%m%d')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "suffix=daily.$DATE" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check-changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view daily &>/dev/null; then
            LAST_SHA=$(gh release view daily --json targetCommitish -q .targetCommitish)
            CURRENT_SHA=$(git rev-parse HEAD)
            echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
            if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No changes since last daily build ($LAST_SHA). Skipping."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manage Build Number
        if: steps.check-changes.outputs.skip != 'true'
        id: build-number
        uses: ./.github/actions/manage-build-number
        with:
          github_token: ${{ secrets.BUILD_NUMBER_PAT }}
          current_build_number: ${{ vars.build_number }}

      - name: Write Build Summary
        if: steps.check-changes.outputs.skip != 'true'
        id: summary
        uses: ./.github/actions/write-build-summary
        with:
          title: Release Builds
          build_number: ${{ steps.build-number.outputs.build_number }}

      - name: Generate changelog
        if: steps.check-changes.outputs.skip != 'true'
        id: changelog
        uses: ./.github/actions/generate-changelog
        with:
          github_token: ${{ github.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          last_sha: ${{ steps.check-changes.outputs.last_sha }}
          head_ref: ${{ github.sha }}
          fallback_message: ${{ steps.summary.outputs.message }}
          model: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}

      - name: Find or create pre-release
        if: steps.check-changes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        shell: bash
        run: |
          STATIC_TOP=$(cat <<'BODY_EOF'
          **Build Number:** ${{ steps.build-number.outputs.build_number }}
          **Commit:** ${{ steps.summary.outputs.sha }}

          ## What's changed
          BODY_EOF
          )

          STATIC_BOTTOM=$(cat <<'BODY_EOF'
          <!--android-build-->

          <!--ios-build-->

          ---
          > [!WARNING]
          > Installing via the provided APK or IPA below is **discouraged**.
          > Please use **Google Play** (Android) or **TestFlight** (iOS) for the best experience and automatic updates.
          BODY_EOF
          )

          BODY=$(printf '%s\n\n%s\n\n%s\n' "$STATIC_TOP" "$CHANGELOG" "$STATIC_BOTTOM")

          if gh release view daily &>/dev/null; then
            gh release delete daily --yes --cleanup-tag
          fi

          gh release create daily \
            --title "Daily Build $(TZ='Asia/Taipei' date +'%Y-%m-%d')" \
            --notes "$BODY" \
            --target "$(git rev-parse HEAD)" \
            --prerelease

  build_android:
    if: needs.prepare.outputs.skip_build != 'true'
    environment: staging
    runs-on: ubuntu-latest
    needs: [prepare]
    timeout-minutes: 30
    env:
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          platform: android

      - name: Build Android staging artifacts
        run: >-
          bundle exec fastlane android build
          env:staging
          build_number:${{ needs.prepare.outputs.build_number }}
          version_suffix:${{ needs.prepare.outputs.version_suffix }}
          store_url:"${{ vars.ANDROID_STORE_URL }}"
          include_apk:true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: |
            build/ci/android/tattoo.aab
            build/ci/android/tattoo.apk
          if-no-files-found: error
          retention-days: 7

  build_ios:
    if: needs.prepare.outputs.skip_build != 'true'
    environment: staging
    runs-on: macos-26
    needs: [prepare]
    timeout-minutes: 30
    env:
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 10
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          platform: ios

      - name: Build iOS staging artifact
        run: >-
          bundle exec fastlane ios build
          env:staging
          build_number:${{ needs.prepare.outputs.build_number }}
          version_suffix:${{ needs.prepare.outputs.version_suffix }}
          store_url:"${{ vars.IOS_STORE_URL }}"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: |
            build/ci/ios/tattoo.ipa
            build/ci/ios/tattoo.app.dSYM.zip
            build/ci/ios/GoogleService-Info.plist
            build/ci/ios/upload-symbols
          if-no-files-found: error
          retention-days: 7

  upload_android_firebase:
    environment: staging
    runs-on: ubuntu-latest
    needs: [prepare, build_android]
    outputs:
      testing_uri: ${{ steps.upload.outputs.testing_uri }}
    env:
      FIREBASEAPPDISTRO_APP: ${{ vars.FIREBASEAPPDISTRO_APP }}
      ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON }}
      CHANGELOG: |
        Daily Build ${{ needs.prepare.outputs.date }}
        ${{ needs.prepare.outputs.store_changelog }}
      PR_TITLE: Daily Build ${{ needs.prepare.outputs.date }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: android

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: build/ci/android

      - name: Materialize Android upload credential
        id: credential
        shell: bash
        run: |
          umask 077
          printf '%s' "$ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/android-upload-service-account.json"
          echo "path=$RUNNER_TEMP/android-upload-service-account.json" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        id: upload
        run: >-
          bundle exec fastlane android upload_firebase
          aab:"${{ github.workspace }}/build/ci/android/tattoo.aab"
          service_credentials_file:"${{ steps.credential.outputs.path }}"

  upload_android_play:
    if: needs.prepare.outputs.public_testers == 'true'
    environment: staging
    runs-on: ubuntu-latest
    needs: [prepare, build_android]
    env:
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON }}
      CHANGELOG: |
        Daily Build ${{ needs.prepare.outputs.date }}
        ${{ needs.prepare.outputs.store_changelog }}
      PR_TITLE: Daily Build ${{ needs.prepare.outputs.date }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: android

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: build/ci/android

      - name: Materialize Android upload credential
        id: credential
        shell: bash
        run: |
          umask 077
          printf '%s' "$ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/android-upload-service-account.json"
          echo "path=$RUNNER_TEMP/android-upload-service-account.json" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play beta
        run: >-
          bundle exec fastlane android upload_play_store
          aab:"${{ github.workspace }}/build/ci/android/tattoo.aab"
          service_credentials_file:"${{ steps.credential.outputs.path }}"
          track:beta
          build_number:${{ needs.prepare.outputs.build_number }}

  publish_android_release_asset:
    runs-on: ubuntu-latest
    needs: [prepare, build_android]
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: build/ci/android

      - name: Upload Android release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload daily "build/ci/android/tattoo.apk#tattoo-${{ needs.prepare.outputs.build_number }}-android.apk" --clobber

  upload_ios_testflight:
    environment: staging
    runs-on: macos-26
    needs: [prepare, build_ios]
    env:
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      CHANGELOG: |
        Daily Build ${{ needs.prepare.outputs.date }}
        ${{ needs.prepare.outputs.store_changelog }}
      PR_TITLE: Daily Build ${{ needs.prepare.outputs.date }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
      COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: ios

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: build/ci/ios

      - name: Upload to TestFlight
        id: upload
        run: >-
          bundle exec fastlane ios upload_testflight
          ipa:"${{ github.workspace }}/build/ci/ios/tattoo.ipa"
          include_public_testers:${{ needs.prepare.outputs.public_testers }}

  upload_ios_symbols:
    environment: staging
    runs-on: macos-26
    needs: [prepare, build_ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: ios

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: build/ci/ios

      - name: Restore upload-symbols permission
        run: chmod +x build/ci/ios/upload-symbols

      - name: Upload Crashlytics symbols
        run: >-
          bundle exec fastlane ios upload_symbols
          dsym:"${{ github.workspace }}/build/ci/ios/tattoo.app.dSYM.zip"
          gsp:"${{ github.workspace }}/build/ci/ios/GoogleService-Info.plist"
          upload_symbols_binary:"${{ github.workspace }}/build/ci/ios/upload-symbols"

  publish_ios_release_asset:
    runs-on: ubuntu-latest
    needs: [prepare, build_ios]
    permissions:
      contents: write
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: build/ci/ios

      - name: Upload iOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload daily "build/ci/ios/tattoo.ipa#tattoo-${{ needs.prepare.outputs.build_number }}-ios.ipa" --clobber

  report:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip_build != 'true'
    environment: staging
    runs-on: ubuntu-latest
    needs:
      - prepare
      - upload_android_firebase
      - upload_android_play
      - publish_android_release_asset
      - upload_ios_testflight
      - upload_ios_symbols
      - publish_ios_release_asset
    permissions:
      contents: write
    steps:
      - name: Checkout Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Write deployment report
        id: results
        shell: bash
        run: |
          android_success=true
          ios_success=true

          if [ "${{ needs.upload_android_firebase.result }}" != "success" ] || [ "${{ needs.publish_android_release_asset.result }}" != "success" ]; then
            android_success=false
          fi
          if [ "${{ needs.prepare.outputs.public_testers }}" = "true" ]; then
            if [ "${{ needs.upload_android_play.result }}" != "success" ]; then
              android_success=false
            fi
          elif [ "${{ needs.upload_android_play.result }}" != "skipped" ]; then
            android_success=false
          fi

          if [ "${{ needs.upload_ios_testflight.result }}" != "success" ] || \
             [ "${{ needs.upload_ios_symbols.result }}" != "success" ] || \
             [ "${{ needs.publish_ios_release_asset.result }}" != "success" ]; then
            ios_success=false
          fi

          {
            echo "## Daily Release"
            echo "**Build Number:** ${{ needs.prepare.outputs.build_number }}"
            if [ "$android_success" = "true" ]; then
              echo
              echo "### Android"
              echo "Firebase App Distribution: successful"
              echo "Google Play beta: ${{ needs.upload_android_play.result }}"
              echo "GitHub Release APK: successful"
            fi
            if [ "$ios_success" = "true" ]; then
              echo
              echo "### iOS"
              echo "TestFlight: successful"
              echo "Crashlytics symbols: successful"
              echo "GitHub Release IPA: successful"
            fi
            if [ "$android_success" != "true" ] && [ "$ios_success" != "true" ]; then
              echo
              echo "No platform completed all required uploads."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "android_success=$android_success" >> "$GITHUB_OUTPUT"
          echo "ios_success=$ios_success" >> "$GITHUB_OUTPUT"
          if [ "$android_success" = "true" ] && [ "$ios_success" = "true" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Android public release notes
        if: steps.results.outputs.android_success == 'true' && needs.prepare.outputs.public_testers == 'true'
        uses: ./.github/actions/append-release-notes
        with:
          github_token: ${{ github.token }}
          tag: <!--android-build-->
          body: |
            ### Android
            You can join the testing program here:

            - **Google Play (Recommended):** [Join the testing program](${{ vars.ANDROID_STORE_URL }})
            - **Firebase App Distribution (For Internal Testers):** [Install build ${{ needs.prepare.outputs.build_number }} in Firebase](${{ needs.upload_android_firebase.outputs.testing_uri }})

            > [!NOTE]
            > The build is available to the Google Play beta track and Firebase internal testers. Google Play processing may take up to 30 minutes.

      - name: Add Android private release notes
        if: steps.results.outputs.android_success == 'true' && needs.prepare.outputs.public_testers != 'true'
        uses: ./.github/actions/append-release-notes
        with:
          github_token: ${{ github.token }}
          tag: <!--android-build-->
          body: |
            ### Android
            Google Play beta upload was skipped for this private-test run.

            - **Firebase App Distribution:** [Install build ${{ needs.prepare.outputs.build_number }}](${{ needs.upload_android_firebase.outputs.testing_uri }})

      - name: Add iOS release notes
        if: steps.results.outputs.ios_success == 'true'
        uses: ./.github/actions/append-release-notes
        with:
          github_token: ${{ github.token }}
          tag: <!--ios-build-->
          body: |
            ### iOS (TestFlight)
            [Join TestFlight](${{ vars.IOS_STORE_URL }}) to install build ${{ needs.prepare.outputs.build_number }}.

            TestFlight groups: ${{ needs.prepare.outputs.public_testers == 'true' && 'Private External Testers and Public External Testers' || 'Private External Testers' }}.

            > [!TIP]
            > Install TestFlight from the App Store if needed. TestFlight is unstable on NTUT Wi-Fi; switch networks if installation or updates fail.

      - name: Fail incomplete daily release
        if: steps.results.outputs.failed == 'true'
        shell: bash
        run: |
          echo "::error::One or more daily release destinations failed or were unexpectedly skipped"
          exit 1

