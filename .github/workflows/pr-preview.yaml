name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' ||
      contains(fromJSON('["deploy:android","deploy:ios"]'), github.event.label.name))
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.existing-artifact.outputs.build_number || steps.build-number.outputs.build_number }}
      artifact_run_id: ${{ steps.existing-artifact.outputs.run_id || github.run_id }}
      artifact_ready: ${{ github.event.action != 'labeled' || steps.existing-artifact.outputs.ready == 'true' }}
      version_suffix: pr.${{ github.event.pull_request.number }}
      commit_sha: ${{ github.event.pull_request.head.sha }}
      commit_message: ${{ github.event.pull_request.title }}
      comment_id: ${{ steps.find-comment.outputs.comment-id || steps.create.outputs.comment-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Manage Build Number
        if: github.event.action != 'labeled'
        id: build-number
        uses: ./.github/actions/manage-build-number
        with:
          github_token: ${{ secrets.BUILD_NUMBER_PAT }}
          current_build_number: ${{ vars.build_number }}

      - name: Resolve existing build artifact
        if: github.event.action == 'labeled'
        id: existing-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(
            gh api --paginate \
              "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq 'first(.artifacts[] | select(.expired == false and .workflow_run.head_sha == "${{ github.event.pull_request.head.sha }}" and (.name | startswith("${{ github.event.label.name == 'deploy:android' && 'android-staging-' || 'ios-staging-' }}")))) | [.workflow_run.id, .name] | @tsv'
          )
          IFS=$'\t' read -r run_id artifact_name <<< "$artifact"
          if [ -z "$run_id" ] || [ -z "$artifact_name" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "ready=true"
            echo "run_id=$run_id"
            echo "build_number=${artifact_name##*-}"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- pr-preview-comment -->

      - name: Create or update build comment
        if: >-
          github.event.action != 'labeled' ||
          steps.existing-artifact.outputs.ready == 'true'
        id: create
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- pr-preview-comment -->
            ## PR Preview Builds (Staging)
            **Build Number:** ${{ steps.existing-artifact.outputs.build_number || steps.build-number.outputs.build_number }}
            **Commit:** ${{ github.event.pull_request.head.sha }}
            **Message:** ${{ github.event.pull_request.title }}
          edit-mode: replace

  build-android:
    if: github.event.action != 'labeled'
    needs: [prepare]
    uses: ./.github/workflows/build-android.yaml
    with:
      environment: staging
      build_number: ${{ needs.prepare.outputs.build_number }}
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  build-ios:
    if: github.event.action != 'labeled'
    needs: [prepare]
    uses: ./.github/workflows/build-ios.yaml
    with:
      environment: staging
      build_number: ${{ needs.prepare.outputs.build_number }}
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  resolve-deployments:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      deploy_android: ${{ steps.flags.outputs.android }}
      deploy_ios: ${{ steps.flags.outputs.ios }}
    steps:
      - name: Resolve current deployment labels
        id: flags
        env:
          ARTIFACT_READY: ${{ needs.prepare.outputs.artifact_ready }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          android=false
          ios=false

          if [ "$EVENT_ACTION" = labeled ]; then
            if [ "$ARTIFACT_READY" = true ]; then
              if [ "$EVENT_LABEL" = deploy:android ]; then
                android=true
              elif [ "$EVENT_LABEL" = deploy:ios ]; then
                ios=true
              fi
            fi
          else
            labels=$(
              gh api \
                "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
                --jq '.labels[].name'
            )
            if [[ $'\n'"$labels"$'\n' == *$'\ndeploy:android\n'* ]] && \
               [ "${{ needs.build-android.result }}" = success ]; then
              android=true
            fi
            if [[ $'\n'"$labels"$'\n' == *$'\ndeploy:ios\n'* ]] && \
               [ "${{ needs.build-ios.result }}" = success ]; then
              ios=true
            fi
          fi

          {
            echo "android=$android"
            echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"

  upload-android-firebase:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.resolve-deployments.result == 'success' &&
      needs.resolve-deployments.outputs.deploy_android == 'true'
    environment:
      name: staging
      deployment: false
    runs-on: ubuntu-latest
    needs: [prepare, resolve-deployments]
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: android

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-staging-${{ needs.prepare.outputs.build_number }}
          path: build/app/outputs/bundle/stagingRelease
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Materialize Android upload credential
        env:
          ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON }}
        id: credential
        run: |
          umask 077
          printf '%s' "$ANDROID_UPLOAD_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/android-upload-service-account.json"
          echo "path=$RUNNER_TEMP/android-upload-service-account.json" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASEAPPDISTRO_APP: ${{ vars.FIREBASEAPPDISTRO_APP }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
        id: upload
        run: >-
          bundle exec fastlane android upload_firebase
          aab:"${{ github.workspace }}/build/app/outputs/bundle/stagingRelease/app-staging-release.aab"
          service_credentials_file:"${{ steps.credential.outputs.path }}"

      - name: Update comment with Android upload
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ needs.prepare.outputs.comment_id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Android (Firebase App Distribution)
            [Install build ${{ needs.prepare.outputs.build_number }}](${{ steps.upload.outputs.testing_uri }})
          edit-mode: append

  upload-ios-testflight:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.resolve-deployments.result == 'success' &&
      needs.resolve-deployments.outputs.deploy_ios == 'true'
    environment:
      name: staging
      deployment: false
    runs-on: macos-26
    needs: [prepare, resolve-deployments]
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: ios

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: .
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.commit_message }}
        run: >-
          bundle exec fastlane ios upload_testflight
          ipa:"${{ github.workspace }}/build/ios/ipa/app-release.ipa"
          include_public_testers:false

      - name: Update comment with iOS upload
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ needs.prepare.outputs.comment_id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### iOS (TestFlight)
            1. Open the TestFlight app on your iOS device
            2. Select "Project Tattoo"
            3. Install build ${{ needs.prepare.outputs.build_number }}
          edit-mode: append

  upload-ios-symbols:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.resolve-deployments.result == 'success' &&
      needs.resolve-deployments.outputs.deploy_ios == 'true'
    environment:
      name: staging
      deployment: false
    runs-on: macos-26
    needs: [prepare, resolve-deployments]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          platform: ios

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-staging-${{ needs.prepare.outputs.build_number }}
          path: .
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Restore upload-symbols permission
        run: chmod +x build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols

      - name: Upload Crashlytics symbols
        run: >-
          bundle exec fastlane ios upload_symbols
          dsym:"${{ github.workspace }}/build/ios/archive/Runner.xcarchive/dSYMs/Runner.app.dSYM.zip"
          gsp:"${{ github.workspace }}/ios/Runner/GoogleService-Info-staging.plist"
          upload_symbols_binary:"${{ github.workspace }}/build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"

  gate:
    name: ${{ github.event.action == 'labeled' && 'PR Deploy' || 'PR Build' }}
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' ||
      contains(fromJSON('["deploy:android","deploy:ios"]'), github.event.label.name))
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-android
      - build-ios
      - resolve-deployments
      - upload-android-firebase
      - upload-ios-testflight
      - upload-ios-symbols
    steps:
      - name: Gate preview result
        env:
          ARTIFACT_READY: ${{ needs.prepare.outputs.artifact_ready }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          if [ "${{ needs.prepare.result }}" != success ]; then
            echo "::error::Preview preparation failed"
            exit 1
          fi

          if [ "$EVENT_ACTION" != labeled ]; then
            if [ "${{ needs.build-android.result }}" != success ] || \
               [ "${{ needs.build-ios.result }}" != success ]; then
              echo "::error::One or more required PR builds failed or were skipped"
              exit 1
            fi
            exit 0
          fi

          if [ "$ARTIFACT_READY" != true ]; then
            echo "The $EVENT_LABEL artifact is still building; the build run will read the label after completion."
            exit 0
          fi

          if [ "$EVENT_LABEL" = deploy:android ] && \
             [ "${{ needs.upload-android-firebase.result }}" != success ]; then
            echo "::error::Android deployment failed or was skipped"
            exit 1
          fi

          if [ "$EVENT_LABEL" = deploy:ios ] && \
             { [ "${{ needs.upload-ios-testflight.result }}" != success ] || \
               [ "${{ needs.upload-ios-symbols.result }}" != success ]; }; then
            echo "::error::iOS deployment failed or was skipped"
            exit 1
          fi
