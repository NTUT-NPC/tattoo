name: tattoo
description: "A modern reimplementation of TAT — the course helper app for Taipei Tech students"
publish_to: 'none'

version: 2.1.0+5277

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  native_dio_adapter: ^1.8.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  html: ^0.15.7
  crypto: ^3.0.7
  dio_redirect_interceptor: ^1.0.1
  collection: ^1.19.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  skeletonizer: ^2.1.3
  animations: ^2.2.0
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  drift_dev: ^2.34.5 # TODO: move back to dev_dependencies after first release
  flutter_image_compress: ^2.5.1
  msgpack_dart: ^1.0.1
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  auto_size_text: ^3.0.0
  table_calendar: ^3.2.1
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  firebase_remote_config: ^6.6.0
  pub_semver: ^2.2.1

# darwin <=0.3.2 declares iOS 12.0 but uses iOS-13+ CryptoKit, breaking the SPM
# iOS build. 0.4.0 only raises that floor. Drop once fss 11 ships stable.
dependency_overrides:
  flutter_secure_storage_darwin: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  flutter_secure_storage_platform_interface: ^2.0.3
  pointycastle: ^4.0.0
  slang_mcp: ^0.2.1
  args: ^2.7.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC[wght].ttf
